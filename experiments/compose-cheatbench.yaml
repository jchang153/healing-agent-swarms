services:
  default:
    image: {{IMAGE_NAME}}
    command: "sleep infinity"
    init: true
    working_dir: /workspace
    network_mode: none
    stop_grace_period: 1s
    mem_limit: 1gb
    cpus: 1
    pids_limit: 256
    volumes:
      - "{{WORKSPACE}}:/workspace"
      - "{{RUNNER_WORK}}:/home/runner/work"
